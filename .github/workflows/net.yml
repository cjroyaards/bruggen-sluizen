name: Ververs vaarwegennetwerk

on:
  schedule:
    - cron: "17 3 * * 1"    # wekelijks, maandag 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: net
  cancel-in-progress: false

jobs:
  net:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Netwerk bouwen (Overpass)
        run: python3 scripts/build_net.py

      - name: Commit & push
        run: |
          git config user.name "data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/net.json.gz
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "data: vaarwegennetwerk ververst"
            git push
          fi
