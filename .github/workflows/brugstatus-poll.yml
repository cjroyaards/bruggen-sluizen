# Stoot de brugstatus-Worker aan: elke 5 min een run die 4½ minuut lang elke
# minuut /poll aanroept. Nodig omdat Cloudflare-cron-triggers op dit account
# niet afgaan (bekend probleem 2026). De Worker slaat over als de data < 45 s is.
name: brugstatus-poll
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: brugstatus-poll
  cancel-in-progress: false
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: poll elke minuut
        run: |
          for i in 1 2 3 4 5; do
            curl -s -m 40 -o /dev/null -w "poll $i: %{http_code}\n" https://brugstatus.cjroyaards.workers.dev/poll || true
            [ $i -lt 5 ] && sleep 55
          done
          curl -s -m 20 https://brugstatus.cjroyaards.workers.dev/health
