# Vangnet voor de brugstatus-Worker: elke 10 min /poll aanroepen. Dat ververst de
# data als die oud is én zet de klok (Durable Object-alarm) weer aan als die
# ooit stilvalt. Het echte minuutwerk doet de klok in de Worker zelf.
name: brugstatus-poll
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: |
          curl -s -m 40 https://brugstatus.cjroyaards.workers.dev/poll; echo
          curl -s -m 20 https://brugstatus.cjroyaards.workers.dev/start; echo
